name: Hot Toys Monitor
on:
  schedule:
    - cron: "*/1 * * * *" # 每 1 分鐘行一次
  workflow_dispatch: # 容許手動啟動

jobs:
  check-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Check RSS and Notify
        run: |
          # 使用 curl 抓取 RSS 並用簡單的 grep 檢查最新內容
          # 這裡建議使用一個不需要 Token 的 RSS 轉換工具網址
          RSS_URL="你的RSS_LINK_HERE"

          # 獲取最新 Post 的標題 (簡單示範)
          CONTENT=$(curl -s $RSS_URL | grep -oP '(?<=<title>).*?(?=</title>)' | sed -n '2p')
          LINK=$(curl -s $RSS_URL | grep -oP '(?<=<link>).*?(?=</link>)' | sed -n '2p')

          # 傳送 Telegram 通知
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TG_CHAT_ID }}" \
          -d "text=🚨 Hot Toys 有新消息！%0A內容：$CONTENT%0A連結：$LINK"
